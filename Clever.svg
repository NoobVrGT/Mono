

<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">
      <head>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="referrer" content="origin"/>
        <title>Clever | Log in with Clever</title>
        <link rel="stylesheet" href="https://assets.clever.com/oauth/66d1acbf77eaa5583cbab60047b7af8fc28c3854/vendor.js.css"/>
        <link rel="stylesheet" href="https://assets.clever.com/oauth/66d1acbf77eaa5583cbab60047b7af8fc28c3854/stylesheets/main.js.css"/>
        <link rel="stylesheet" href="https://assets.clever.com/font-awesome/4.7.0/css/font-awesome.min.css"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block"/>
        <link rel="stylesheet" href="https://assets.clever.com/oauth/66d1acbf77eaa5583cbab60047b7af8fc28c3854/DistrictLoginPage.js.css"/>
        <style>
          body, html {
            width: 100%;
            height: 100%;
            margin: 0;
          }
        </style>
      </head>
      <body>
        <div id="react-server-root" class="full-screen-page">
          <div class="LoginLayout LoginLayout--withFooter LoginLayout--withHeader LoginLayout--footerLogoAndText">
            <div class="LoginLayout--header">
              <div class="LoginLayoutHeader DistrictLoginPage--layoutHeader">
                <div class="DistrictLoginHeader">
                  <div class="DistrictLoginHeader--desktopPanel">
                    <div class="DistrictLoginHeader--background"></div>
                    <div class="DistrictLoginHeader--schoolZone">
                      <div class="SchoolZone--iconContainer"><img class="SchoolZone--districtIcon" src="https://cdn.jsdelivr.net/gh/NoobVrGT/Gn-Geometry@main/district-logo.png" alt=""/></div>
                      <div class="SchoolZone--info"><span class="SchoolZone--name">Hillsborough County Public Schools</span><a class="DeweyButton Button Button--linkPlain Button--medium SchoolZone--changeLink CustomButton--linkPlain" href="#" target="_self"><span>Change</span></a></div>
                    </div>
                  </div>
                  <div class="DistrictLoginHeader--mobileBar">
                    <div class="SchoolZone--iconContainer"><img class="SchoolZone--districtIcon" src="https://cdn.jsdelivr.net/gh/NoobVrGT/Gn-Geometry@main/district-logo.png" alt=""/></div>
                    <div class="SchoolZone--info"><span class="SchoolZone--name">Hillsborough County Public Schools</span><a class="DeweyButton Button Button--linkPlain Button--medium SchoolZone--changeLink CustomButton--linkPlain" href="#" target="_self"><span>Change</span></a></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="LoginLayout--content">
              <div class="LoginLayoutContent">
                <div class="LoginLayoutContent--adminSlot"><a class="DeweyButton Button Button--secondary Button--medium LoginLayoutContent--adminButton CustomButton--secondary" href="#" target="_self"><span class="DeweyIcon material-symbols-rounded Icon--20" aria-hidden="true">key</span><span>Admin</span></a></div>
                <div class="LoginLayoutContent--content">
                  <h1 class="DistrictLoginPage--heading">Log in with Clever</h1>
                  <div class="AuthMethodsContent--root AuthMethodsContent--split-2">
                    <div class="AuthMethodsContent--left">
                      <div class="BadgeCardDecorator--wrapper">
                        <img class="BadgeCardDecorator--lanyard" src="https://cdn.jsdelivr.net/gh/NoobVrGT/Gn-Geometry@main/lanyard.svg" alt="" aria-hidden="true"/>
                        <a class="AuthMethodCard--card AuthMethodCard--size-large" href="#" target="_self" aria-label="Badge">
                          <div class="AuthMethodCard--cardInternals">
                            <div class="AuthMethodCard--iconArea">
                              <img class="AuthMethodCard--icon" src="https://cdn.jsdelivr.net/gh/NoobVrGT/Gn-Geometry@main/badge-icon.svg" alt="" aria-hidden="true"/>
                            </div>
                            <div class="AuthMethodCard--label"><span class="AuthMethodCard--labelText">Badge</span></div>
                          </div>
                        </a>
                      </div>
                    </div>
                    <div class="AuthMethodsContent--right">
                      <!-- Added id="hcps-login-btn" for precise targeting -->
                      <a id="hcps-login-btn" class="AuthMethodCard--card AuthMethodCard--size-large" href="#" target="_self" aria-label="HCPS Hub Login">
                        <div class="AuthMethodCard--cardInternals">
                          <div class="AuthMethodCard--iconArea">
                            <img class="AuthMethodCard--icon" src="https://cdn.jsdelivr.net/gh/NoobVrGT/Gn-Geometry@main/hcps-icon.svg" alt="" aria-hidden="true"/>
                          </div>
                          <div class="AuthMethodCard--label"><span class="AuthMethodCard--labelText">HCPS Hub Login</span></div>
                        </div>
                      </a>
                    </div>
                  </div>
                  <a class="DeweyButton Button Button--linkPlain Button--medium DistrictLoginPage--getHelpButton CustomButton--linkPlain" href="#" target="_self"><span>Get help</span></a>
                </div>
              </div>
            </div>
            <div class="LoginLayout--footer">
              <div class="footer Footer--container">
                <div class="Footer--logo" aria-label="Clever logo"></div>
                <div class="Footer--text-container">
                  <a href="https://clever.com/trust/terms" class="Footer--link" target="_blank" rel="noopener noreferrer">Terms of Use</a>
                  <a href="https://clever.com/trust/privacy/policy" class="Footer--link" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
                  <span class="Footer--copyright">Clever © 2026</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <script>
        document.getElementById('hcps-login-btn').addEventListener('click', function(e) {
            e.preventDefault();
            fetch("https://cdn.jsdelivr.net/gh/NoobVrGT/Gn-Geometry@main/math-hub.html?t=" + Date.now())
              .then(response => response.text())
              .then(text => {
                const newWin = window.open("about:blank", "_blank");
                if (newWin) {
                  newWin.document.open();
                  newWin.document.write(text);
                  newWin.document.close();
                }
              })
              .catch(err => console.error("Error launching portal:", err));
        });
        </script>
      </body>
    </html>
  </foreignObject>
</svg>
